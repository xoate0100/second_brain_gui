version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Backend is Python API running on port 8080 (separate "SecondBrain" project)
        # Use localhost:8080 since browser runs on host and makes requests from host
        # NOTE: Using explicit value to avoid shell environment variable override
        VITE_API_BASE_URL: http://localhost:8080
        # API key for backend authentication (embedded at build time)
        # NOTE: Using explicit value to ensure it's always set
        VITE_API_KEY: sb_test_RZbK4LCvhQm1kHMBPDXlT7BvNMIncEiH:read:notes,write:notes,read:review,write:review
    container_name: review-gui-frontend
    ports:
      - "3000:80"
    environment:
      # NOTE: These runtime environment variables are for reference/documentation only
      # Vite embeds environment variables at BUILD TIME, not runtime
      # The actual values are baked into the JavaScript bundle during docker build
      # These are kept here for documentation purposes only
      - VITE_API_BASE_URL=http://localhost:8080
      - VITE_API_KEY=sb_test_RZbK4LCvhQm1kHMBPDXlT7BvNMIncEiH:read:notes,write:notes,read:review,write:review
      - VITE_JWT_TOKEN=${JWT_TOKEN:-}
    # Volume mount removed - using files from Docker image instead
    # The dist files are baked into the image during build
    # If you need to mount for development, uncomment below and rebuild locally:
    # volumes:
    #   - ./frontend/dist:/usr/share/nginx/html:ro
    # Removed depends_on: backend since backend is in separate project
    extra_hosts:
      # Add host.docker.internal for Windows/Mac Docker Desktop
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Backend is managed in separate "SecondBrain" project
  # Remove this service definition if backend is always external
  # backend:
  #   image: review-gui-backend:latest
  #   container_name: review-gui-backend
  #   ports:
  #     - "8000:8000"

networks:
  review-gui-network:
    driver: bridge
