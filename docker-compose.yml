version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: review-gui-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://backend:8000
      - VITE_API_KEY=${API_KEY:-}
      - VITE_JWT_TOKEN=${JWT_TOKEN:-}
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - review-gui-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend:
    # Backend service placeholder
    # Replace with actual backend image when available
    image: review-gui-backend:latest
    container_name: review-gui-backend
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-}
    networks:
      - review-gui-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  review-gui-network:
    driver: bridge

